<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عُهدتي — إدارة العهد والتصفية</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Tahoma",sans-serif;
  background:#f4f7f5;
  color:#17332b;
}

header{
  background:#073b32;
  color:white;
  padding:22px 18px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
  opacity:.9;
  font-size:14px;
}

.container{
  width:94%;
  max-width:750px;
  margin:18px auto 40px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
  font-size:19px;
}

label{
  display:block;
  margin:13px 0 7px;
  font-weight:bold;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d8e1dd;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  font-family:inherit;
  outline:none;
  background:#fafcfb;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#087f5b;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin-top:15px;
  font-size:16px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#087f5b;
  color:white;
}

.secondary{
  background:#e9f2ee;
  color:#07533e;
}

.danger{
  background:#ffe9e9;
  color:#a40000;
}

.warning{
  background:#fff4d9;
  color:#805600;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#f4f8f6;
  border-radius:14px;
  padding:15px;
  text-align:center;
}

.stat small{
  display:block;
  color:#66756f;
  margin-bottom:7px;
}

.stat strong{
  font-size:19px;
}

.entry{
  border:1px solid #e1e9e5;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
}

.entry-title{
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.entry-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px dashed #e3e9e6;
}

.entry-row:last-child{
  border-bottom:0;
}

.amount{
  color:#087f5b;
  font-weight:bold;
}

.remaining{
  color:#07533e;
  font-weight:bold;
}

.person{
  background:#f7faf8;
  border:1px solid #e0e9e5;
  border-radius:14px;
  padding:13px;
  margin-top:10px;
}

.person-title{
  font-weight:bold;
  font-size:17px;
  margin-bottom:8px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  background:#e8f5ef;
  color:#087f5b;
  font-size:12px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#7b8782;
  padding:20px 5px;
}

.note{
  color:#66756f;
  font-size:13px;
  margin-top:8px;
}

.delete-btn{
  background:#fff1f1;
  color:#a40000;
  margin-top:10px;
  padding:10px;
}

.small-btn{
  padding:10px;
  font-size:14px;
}

.total-box{
  background:#073b32;
  color:white;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
  text-align:center;
}

.total-box strong{
  display:block;
  font-size:23px;
  margin-top:5px;
}

.divider{
  height:1px;
  background:#e5ebe8;
  margin:18px 0;
}

footer{
  text-align:center;
  color:#7a8781;
  font-size:12px;
  margin-top:25px;
}
</style>
</head>

<body>

<header>
  <h1>عُهدتي</h1>
  <p>إدارة العهد والتصفية</p>
</header>

<div class="container">

  <!-- الملخص -->
  <div class="card">
    <h2>📊 ملخص العهد</h2>

    <div class="stats">

      <div class="stat">
        <small>إجمالي العهد المستلمة</small>
        <strong id="totalReceived">0</strong>
      </div>

      <div class="stat">
        <small>إجمالي الموزع</small>
        <strong id="totalDistributed">0</strong>
      </div>

      <div class="stat">
        <small>المتبقي لديّ</small>
        <strong id="totalRemaining">0</strong>
      </div>

      <div class="stat">
        <small>عدد العهد</small>
        <strong id="totalEntries">0</strong>
      </div>

    </div>
  </div>


  <!-- استلام عهدة -->
  <div class="card">

    <h2>🏦 استلام عهدة جديدة</h2>

    <label>الجهة التي سلمت العهدة</label>

    <input
      id="source"
      type="text"
      placeholder="مثال: الإدارة المالية"
    >

    <label>المبلغ</label>

    <input
      id="amount"
      type="number"
      inputmode="decimal"
      placeholder="مثال: 500000"
    >

    <label>التاريخ</label>

    <input
      id="date"
      type="date"
    >

    <label>رقم المرجع</label>

    <input
      id="reference"
      type="text"
      placeholder="اختياري"
    >

    <label>ملاحظات</label>

    <textarea
      id="notes"
      placeholder="أي ملاحظات عن العهدة..."
    ></textarea>

    <button class="primary" onclick="addCustody()">
      ➕ تسجيل العهدة
    </button>

  </div>


  <!-- قائمة العهد -->
  <div class="card">

    <h2>📋 العهد المسجلة</h2>

    <div id="custodyList"></div>

  </div>


  <!-- العهد الموزعة -->
  <div class="card">

    <h2>👥 العهد عند الأشخاص</h2>

    <div id="personList"></div>

  </div>


  <footer>
    عُهدتي — نظام شخصي لإدارة العهد والتصفية
  </footer>

</div>


<script>

/* =========================
   البيانات
========================= */

let custodys = JSON.parse(
  localStorage.getItem("ahdati_custodys") || "[]"
);

let distributions = JSON.parse(
  localStorage.getItem("ahdati_distributions") || "[]"
);


/* =========================
   التاريخ
========================= */

document.getElementById("date").value =
  new Date().toISOString().split("T")[0];


/* =========================
   حفظ البيانات
========================= */

function saveData(){

  localStorage.setItem(
    "ahdati_custodys",
    JSON.stringify(custodys)
  );

  localStorage.setItem(
    "ahdati_distributions",
    JSON.stringify(distributions)
  );

}


/* =========================
   إضافة عهدة
========================= */

function addCustody(){

  const source =
    document.getElementById("source").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  const date =
    document.getElementById("date").value;

  const reference =
    document.getElementById("reference").value.trim();

  const notes =
    document.getElementById("notes").value.trim();


  if(!source){

    alert("اكتب الجهة التي سلمت العهدة");

    return;
  }


  if(!amount || amount <= 0){

    alert("اكتب مبلغًا صحيحًا");

    return;
  }


  if(!date){

    alert("اختر التاريخ");

    return;
  }


  const custody = {

    id: Date.now(),

    source: source,

    amount: amount,

    spent: 0,

    remaining: amount,

    date: date,

    reference: reference,

    notes: notes,

    status: "مفتوحة"

  };


  custodys.unshift(custody);

  saveData();

  clearForm();

  render();

  alert("تم تسجيل العهدة بنجاح ✅");

}


/* =========================
   تنظيف النموذج
========================= */

function clearForm(){

  document.getElementById("source").value = "";

  document.getElementById("amount").value = "";

  document.getElementById("reference").value = "";

  document.getElementById("notes").value = "";

  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

}


/* =========================
   إجمالي الموزع لعهدة معينة
========================= */

function distributedForCustody(custodyId){

  return distributions
    .filter(x => x.custodyId === custodyId)
    .reduce((sum,x) => sum + Number(x.amount || 0),0);

}


/* =========================
   عرض العهد
========================= */

function render(){

  const list =
    document.getElementById("custodyList");

  list.innerHTML = "";


  if(custodys.length === 0){

    list.innerHTML =
      '<div class="empty">لا توجد عهد مسجلة حتى الآن</div>';

    updateStats();

    renderPersons();

    return;
  }


  custodys.forEach(item => {

    const distributed =
      distributedForCustody(item.id);

    const remaining =
      Number(item.amount) - distributed;


    const div =
      document.createElement("div");

    div.className = "entry";


    div.innerHTML = `

      <div class="entry-title">
        🏦 ${escapeHtml(item.source)}
      </div>

      <div class="entry-row">
        <span>المبلغ المستلم</span>
        <span class="amount">
          ${formatMoney(item.amount)}
        </span>
      </div>

      <div class="entry-row">
        <span>المبلغ الموزع</span>
        <span>
          ${formatMoney(distributed)}
        </span>
      </div>

      <div class="entry-row">
        <span>المتبقي لديّ</span>
        <span class="remaining">
          ${formatMoney(remaining)}
        </span>
      </div>

      <div class="entry-row">
        <span>التاريخ</span>
        <span>
          ${escapeHtml(item.date)}
        </span>
      </div>

      <div class="entry-row">
        <span>الحالة</span>
        <span class="status">
          ${remaining > 0 ? "مفتوحة" : "موزعة بالكامل"}
        </span>
      </div>

      ${
        item.reference
        ?
        `<div class="note">
          المرجع: ${escapeHtml(item.reference)}
        </div>`
        :
        ""
      }

      ${
        item.notes
        ?
        `<div class="note">
          ${escapeHtml(item.notes)}
        </div>`
        :
        ""
      }

      <button
        class="primary small-btn"
        onclick="openDistribution(${item.id})">
        👤 توزيع من هذه العهدة
      </button>

      <button
        class="delete-btn"
        onclick="deleteCustody(${item.id})">
        🗑️ حذف العهدة
      </button>

    `;


    list.appendChild(div);

  });


  updateStats();

  renderPersons();

}


/* =========================
   نافذة توزيع العهدة
========================= */

function openDistribution(custodyId){

  const custody =
    custodys.find(x => x.id === custodyId);

  if(!custody) return;


  const distributed =
    distributedForCustody(custodyId);

  const remaining =
    Number(custody.amount) - distributed;


  if(remaining <= 0){

    alert("تم توزيع كامل مبلغ هذه العهدة.");

    return;
  }


  const person =
    prompt(
      "اكتب اسم الشخص الذي ستعطيه العهدة:"
    );


  if(!person || !person.trim()){

    return;
  }


  const type =
    prompt(
      "اكتب نوع العهدة أو الغرض:\nمثال: الأنشطة أو الصيانة"
    );


  if(!type || !type.trim()){

    return;
  }


  const amountText =
    prompt(
      "اكتب مبلغ العهدة:\nالمتاح: " +
      formatMoney(remaining)
    );


  if(amountText === null) return;


  const amount =
    Number(amountText);


  if(!amount || amount <= 0){

    alert("أدخل مبلغًا صحيحًا.");

    return;
  }


  if(amount > remaining){

    alert(
      "المبلغ أكبر من المتبقي في العهدة.\n\n" +
      "المتاح: " +
      formatMoney(remaining)
    );

    return;
  }


  const distribution = {

    id: Date.now(),

    custodyId: custodyId,

    person: person.trim(),

    type: type.trim(),

    amount: amount,

    spent: 0,

    remaining: amount,

    date:
      new Date().toISOString().split("T")[0],

    status: "غير مصفاة"

  };


  distributions.unshift(distribution);

  saveData();

  render();


  alert(
    "تم توزيع العهدة بنجاح ✅\n\n" +
    person.trim() +
    "\n" +
    type.trim() +
    "\n" +
    formatMoney(amount)
  );

}


/* =========================
   عرض العهد عند الأشخاص
========================= */

function renderPersons(){

  const list =
    document.getElementById("personList");

  list.innerHTML = "";


  if(distributions.length === 0){

    list.innerHTML =
      '<div class="empty">لم يتم توزيع أي عهد على الأشخاص حتى الآن.</div>';

    return;
  }


  distributions.forEach(item => {

    const custody =
      custodys.find(x => x.id === item.custodyId);


    const div =
      document.createElement("div");

    div.className = "person";


    div.innerHTML = `

      <div class="person-title">
        👤 ${escapeHtml(item.person)}
      </div>

      <div class="entry-row">
        <span>نوع العهدة</span>
        <span>
          ${escapeHtml(item.type)}
        </span>
      </div>

      <div class="entry-row">
        <span>المبلغ المسلم</span>
        <span class="amount">
          ${formatMoney(item.amount)}
        </span>
      </div>

      <div class="entry-row">
        <span>المصروف</span>
        <span>
          ${formatMoney(item.spent)}
        </span>
      </div>

      <div class="entry-row">
        <span>المتبقي</span>
        <span class="remaining">
          ${formatMoney(item.remaining)}
        </span>
      </div>

      <div class="entry-row">
        <span>الحالة</span>
        <span class="status">
          ${escapeHtml(item.status)}
        </span>
      </div>

      ${
        custody
        ?
        `<div class="note">
          العهدة الأصلية: ${escapeHtml(custody.source)}
        </div>`
        :
        ""
      }

      <div class="note">
        تاريخ التسليم: ${escapeHtml(item.date)}
      </div>

      <button
        class="secondary small-btn"
        onclick="showDistributionInfo(${item.id})">
        👁️ تفاصيل العهدة
      </button>

      <button
        class="delete-btn"
        onclick="deleteDistribution(${item.id})">
        🗑️ حذف عهدة الشخص
      </button>

    `;


    list.appendChild(div);

  });

}


/* =========================
   تفاصيل عهدة الشخص
========================= */

function showDistributionInfo(id){

  const item =
    distributions.find(x => x.id === id);

  if(!item) return;


  alert(
    "تفاصيل العهدة\n\n" +

    "الشخص: " + item.person + "\n" +

    "النوع: " + item.type + "\n" +

    "المبلغ: " + formatMoney(item.amount) + "\n" +

    "المصروف: " + formatMoney(item.spent) + "\n" +

    "المتبقي: " + formatMoney(item.remaining) + "\n\n" +

    "الحالة: " + item.status
  );

}


/* =========================
   حذف عهدة شخص
========================= */

function deleteDistribution(id){

  const item =
    distributions.find(x => x.id === id);

  if(!item) return;


  const ok =
    confirm(
      "هل أنت متأكد من حذف عهدة " +
      item.person +
      "؟"
    );


  if(!ok) return;


  distributions =
    distributions.filter(x => x.id !== id);

  saveData();

  render();

}


/* =========================
   تحديث الإحصائيات
========================= */

function updateStats(){

  let received = 0;

  let distributed = 0;


  custodys.forEach(item => {

    received +=
      Number(item.amount) || 0;

  });


  distributions.forEach(item => {

    distributed +=
      Number(item.amount) || 0;

  });


  const remaining =
    received - distributed;


  document.getElementById("totalReceived").textContent =
    formatMoney(received);

  document.getElementById("totalDistributed").textContent =
    formatMoney(distributed);

  document.getElementById("totalRemaining").textContent =
    formatMoney(remaining);

  document.getElementById("totalEntries").textContent =
    custodys.length;

}


/* =========================
   تنسيق المبالغ
========================= */

function formatMoney(number){

  return Number(number || 0)
    .toLocaleString("ar-YE") +
    " ريال";

}


/* =========================
   حماية النصوص
========================= */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================
   تشغيل التطبيق
========================= */

render();

</script>

</body>
</html>
