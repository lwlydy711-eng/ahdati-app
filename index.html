<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عُهدتي — إدارة العهد والتصفية</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Tahoma",sans-serif;
  background:#f4f7f5;
  color:#17332b;
}

header{
  background:#073b32;
  color:white;
  padding:22px 18px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
  opacity:.9;
  font-size:14px;
}

.container{
  width:94%;
  max-width:760px;
  margin:18px auto 40px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
  font-size:19px;
}

label{
  display:block;
  margin:13px 0 7px;
  font-weight:bold;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #d8e1dd;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  font-family:inherit;
  outline:none;
  background:#fafcfb;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#087f5b;
}

textarea{
  min-height:85px;
  resize:vertical;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin-top:12px;
  font-size:16px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#087f5b;
  color:white;
}

.secondary{
  background:#e9f2ee;
  color:#07533e;
}

.danger{
  background:#ffe9e9;
  color:#a40000;
}

.warning{
  background:#fff4d9;
  color:#805600;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#f4f8f6;
  border-radius:14px;
  padding:14px;
  text-align:center;
}

.stat small{
  display:block;
  color:#66756f;
  margin-bottom:7px;
}

.stat strong{
  font-size:18px;
}

.entry{
  border:1px solid #e1e9e5;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
}

.entry-title{
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.entry-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px dashed #e3e9e6;
}

.entry-row:last-child{
  border-bottom:0;
}

.amount{
  color:#087f5b;
  font-weight:bold;
}

.remaining{
  color:#07533e;
  font-weight:bold;
}

.person{
  background:#f7faf8;
  border:1px solid #e0e9e5;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
}

.person-title{
  font-weight:bold;
  font-size:17px;
  margin-bottom:8px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  background:#e8f5ef;
  color:#087f5b;
  font-size:12px;
  font-weight:bold;
}

.status-open{
  background:#fff4d9;
  color:#805600;
}

.status-done{
  background:#e8f5ef;
  color:#087f5b;
}

.empty{
  text-align:center;
  color:#7b8782;
  padding:20px 5px;
}

.note{
  color:#66756f;
  font-size:13px;
  margin-top:8px;
}

.delete-btn{
  background:#fff1f1;
  color:#a40000;
}

.small-btn{
  padding:10px;
  font-size:14px;
}

.total-box{
  background:#073b32;
  color:white;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
  text-align:center;
}

.total-box strong{
  display:block;
  font-size:22px;
  margin-top:5px;
}

.invoice{
  background:white;
  border:1px solid #e1e9e5;
  border-radius:14px;
  padding:13px;
  margin-top:10px;
}

.invoice img{
  width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:10px;
  margin-top:10px;
  background:#f3f5f4;
}

.invoice-title{
  font-weight:bold;
  margin-bottom:6px;
}

.camera-label{
  display:block;
  background:#e9f2ee;
  color:#07533e;
  border-radius:13px;
  padding:14px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.camera-label input{
  display:none;
}

.divider{
  height:1px;
  background:#e5ebe8;
  margin:18px 0;
}

.back-btn{
  margin-bottom:12px;
}

footer{
  text-align:center;
  color:#7a8781;
  font-size:12px;
  margin-top:25px;
}
</style>
</head>

<body>

<header>
  <h1>عُهدتي</h1>
  <p>إدارة العهد والتصفية</p>
</header>

<div class="container">

  <!-- الصفحة الرئيسية -->

  <div id="homePage">

    <div class="card">

      <h2>📊 ملخص العهد</h2>

      <div class="stats">

        <div class="stat">
          <small>إجمالي العهد المستلمة</small>
          <strong id="totalReceived">0</strong>
        </div>

        <div class="stat">
          <small>إجمالي الموزع</small>
          <strong id="totalDistributed">0</strong>
        </div>

        <div class="stat">
          <small>المتبقي لديّ</small>
          <strong id="totalRemaining">0</strong>
        </div>

        <div class="stat">
          <small>عهد غير مصفاة</small>
          <strong id="openCount">0</strong>
        </div>

      </div>

    </div>


    <!-- استلام عهدة -->

    <div class="card">

      <h2>🏦 استلام عهدة جديدة</h2>

      <label>الجهة التي سلمت العهدة</label>

      <input
        id="source"
        type="text"
        placeholder="مثال: الإدارة المالية"
      >

      <label>المبلغ</label>

      <input
        id="amount"
        type="number"
        inputmode="decimal"
        placeholder="مثال: 500000"
      >

      <label>التاريخ</label>

      <input
        id="date"
        type="date"
      >

      <label>رقم المرجع</label>

      <input
        id="reference"
        type="text"
        placeholder="اختياري"
      >

      <label>ملاحظات</label>

      <textarea
        id="notes"
        placeholder="أي ملاحظات عن العهدة..."
      ></textarea>

      <button class="primary" onclick="addCustody()">
        ➕ تسجيل العهدة
      </button>

    </div>


    <!-- العهد الأصلية -->

    <div class="card">

      <h2>📋 العهد المسجلة</h2>

      <div id="custodyList"></div>

    </div>


    <!-- عهد الأشخاص -->

    <div class="card">

      <h2>👥 العهد عند الأشخاص</h2>

      <div id="personList"></div>

    </div>

  </div>


  <!-- صفحة تفاصيل الشخص -->

  <div id="personPage" style="display:none">

    <button
      class="secondary back-btn"
      onclick="goHome()">
      ↩️ العودة إلى العهد
    </button>


    <div id="personDetails"></div>


    <!-- إضافة فاتورة -->

    <div class="card">

      <h2>🧾 إضافة فاتورة</h2>

      <label>مبلغ الفاتورة</label>

      <input
        id="invoiceAmount"
        type="number"
        inputmode="decimal"
        placeholder="مثال: 25000"
      >

      <label>تاريخ الفاتورة</label>

      <input
        id="invoiceDate"
        type="date"
      >

      <label>وصف المصروف</label>

      <input
        id="invoiceDescription"
        type="text"
        placeholder="مثال: شراء أدوات"
      >

      <label>ملاحظات</label>

      <textarea
        id="invoiceNotes"
        placeholder="اختياري"
      ></textarea>


      <label class="camera-label">

        📷 تصوير الفاتورة بالكاميرا

        <input
          id="invoicePhoto"
          type="file"
          accept="image/*"
          capture="environment"
          onchange="previewInvoicePhoto(event)"
        >

      </label>


      <div id="photoPreview"></div>


      <button
        class="primary"
        onclick="addInvoice()">

        🧾 حفظ الفاتورة

      </button>

    </div>


    <!-- الفواتير -->

    <div class="card">

      <h2>📚 فواتير العهدة</h2>

      <div id="invoiceList"></div>

    </div>

  </div>


  <footer>
    عُهدتي — نظام شخصي لإدارة العهد والتصفية
  </footer>

</div>


<script>

/* ===================================
   البيانات
=================================== */

let custodys = JSON.parse(
  localStorage.getItem("ahdati_custodys") || "[]"
);

let distributions = JSON.parse(
  localStorage.getItem("ahdati_distributions") || "[]"
);

let invoices = JSON.parse(
  localStorage.getItem("ahdati_invoices") || "[]"
);

let currentDistributionId = null;

let currentPhoto = "";


/* ===================================
   التاريخ
=================================== */

document.getElementById("date").value =
  new Date().toISOString().split("T")[0];

document.getElementById("invoiceDate").value =
  new Date().toISOString().split("T")[0];


/* ===================================
   الحفظ
=================================== */

function saveData(){

  localStorage.setItem(
    "ahdati_custodys",
    JSON.stringify(custodys)
  );

  localStorage.setItem(
    "ahdati_distributions",
    JSON.stringify(distributions)
  );

  localStorage.setItem(
    "ahdati_invoices",
    JSON.stringify(invoices)
  );

}


/* ===================================
   إضافة العهدة الأصلية
=================================== */

function addCustody(){

  const source =
    document.getElementById("source").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  const date =
    document.getElementById("date").value;

  const reference =
    document.getElementById("reference").value.trim();

  const notes =
    document.getElementById("notes").value.trim();


  if(!source){

    alert("اكتب الجهة التي سلمت العهدة");

    return;
  }


  if(!amount || amount <= 0){

    alert("اكتب مبلغًا صحيحًا");

    return;
  }


  if(!date){

    alert("اختر التاريخ");

    return;
  }


  const custody = {

    id: Date.now(),

    source: source,

    amount: amount,

    date: date,

    reference: reference,

    notes: notes

  };


  custodys.unshift(custody);

  saveData();

  clearCustodyForm();

  render();

  alert("تم تسجيل العهدة بنجاح ✅");

}


/* ===================================
   تنظيف نموذج العهدة
=================================== */

function clearCustodyForm(){

  document.getElementById("source").value = "";

  document.getElementById("amount").value = "";

  document.getElementById("reference").value = "";

  document.getElementById("notes").value = "";

  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

}


/* ===================================
   إجمالي توزيع عهدة
=================================== */

function distributedForCustody(custodyId){

  return distributions

    .filter(x => x.custodyId === custodyId)

    .reduce(
      (sum,x) =>
        sum + Number(x.amount || 0),
      0
    );

}


/* ===================================
   إجمالي فواتير عهدة شخص
=================================== */

function invoiceTotal(distributionId){

  return invoices

    .filter(x => x.distributionId === distributionId)

    .reduce(
      (sum,x) =>
        sum + Number(x.amount || 0),
      0
    );

}


/* ===================================
   حساب المتبقي للشخص
=================================== */

function personRemaining(item){

  const total =
    invoiceTotal(item.id);

  return Number(item.amount) - total;

}


/* ===================================
   عرض الصفحة
=================================== */

function render(){

  renderCustodys();

  renderPersons();

  updateStats();

}


/* ===================================
   عرض العهد الأصلية
=================================== */

function renderCustodys(){

  const list =
    document.getElementById("custodyList");

  list.innerHTML = "";


  if(custodys.length === 0){

    list.innerHTML =
      '<div class="empty">لا توجد عهد مسجلة حتى الآن</div>';

    return;
  }


  custodys.forEach(item => {

    const distributed =
      distributedForCustody(item.id);

    const remaining =
      Number(item.amount) - distributed;


    const div =
      document.createElement("div");

    div.className = "entry";


    div.innerHTML = `

      <div class="entry-title">
        🏦 ${escapeHtml(item.source)}
      </div>

      <div class="entry-row">
        <span>المبلغ المستلم</span>

        <span class="amount">
          ${formatMoney(item.amount)}
        </span>
      </div>

      <div class="entry-row">
        <span>المبلغ الموزع</span>

        <span>
          ${formatMoney(distributed)}
        </span>
      </div>

      <div class="entry-row">
        <span>المتبقي لديّ</span>

        <span class="remaining">
          ${formatMoney(remaining)}
        </span>
      </div>

      <div class="entry-row">
        <span>التاريخ</span>

        <span>
          ${escapeHtml(item.date)}
        </span>
      </div>

      ${
        item.reference
        ?
        `<div class="note">
          المرجع: ${escapeHtml(item.reference)}
        </div>`
        :
        ""
      }

      ${
        item.notes
        ?
        `<div class="note">
          ${escapeHtml(item.notes)}
        </div>`
        :
        ""
      }

      <button
        class="primary small-btn"
        onclick="openDistribution(${item.id})">

        👤 توزيع من هذه العهدة

      </button>

      <button
        class="danger small-btn"
        onclick="deleteCustody(${item.id})">

        🗑️ حذف العهدة

      </button>

    `;


    list.appendChild(div);

  });

}


/* ===================================
   توزيع العهدة
=================================== */

function openDistribution(custodyId){

  const custody =
    custodys.find(x => x.id === custodyId);

  if(!custody) return;


  const distributed =
    distributedForCustody(custodyId);

  const remaining =
    Number(custody.amount) - distributed;


  if(remaining <= 0){

    alert(
      "لا يوجد مبلغ متبقٍ لتوزيعه."
    );

    return;
  }


  const person =
    prompt(
      "اكتب اسم الشخص:"
    );


  if(!person || !person.trim()){

    return;
  }


  const type =
    prompt(
      "اكتب نوع العهدة أو الغرض:\nمثال: الأنشطة أو الصيانة"
    );


  if(!type || !type.trim()){

    return;
  }


  const amountText =
    prompt(
      "اكتب المبلغ:\nالمتاح " +
      formatMoney(remaining)
    );


  if(amountText === null) return;


  const amount =
    Number(amountText);


  if(!amount || amount <= 0){

    alert("أدخل مبلغًا صحيحًا.");

    return;
  }


  if(amount > remaining){

    alert(
      "المبلغ أكبر من المتاح.\n\n" +
      "المتاح: " +
      formatMoney(remaining)
    );

    return;
  }


  const distribution = {

    id: Date.now(),

    custodyId: custodyId,

    person: person.trim(),

    type: type.trim(),

    amount: amount,

    date:
      new Date().toISOString().split("T")[0]

  };


  distributions.unshift(distribution);

  saveData();

  render();


  alert(
    "تم توزيع العهدة بنجاح ✅\n\n" +
    person.trim() +
    "\n" +
    type.trim() +
    "\n" +
    formatMoney(amount)
  );

}


/* ===================================
   عرض الأشخاص
=================================== */

function renderPersons(){

  const list =
    document.getElementById("personList");

  list.innerHTML = "";


  if(distributions.length === 0){

    list.innerHTML =
      '<div class="empty">لم يتم توزيع أي عهد على الأشخاص حتى الآن.</div>';

    return;
  }


  distributions.forEach(item => {

    const custody =
      custodys.find(
        x => x.id === item.custodyId
      );


    const totalInvoices =
      invoiceTotal(item.id);


    const remaining =
      personRemaining(item);


    const completed =
      remaining === 0;


    const div =
      document.createElement("div");

    div.className = "person";


    div.innerHTML = `

      <div class="person-title">
        👤 ${escapeHtml(item.person)}
      </div>

      <div class="entry-row">
        <span>نوع العهدة</span>

        <span>
          ${escapeHtml(item.type)}
        </span>
      </div>

      <div class="entry-row">
        <span>المبلغ المسلم</span>

        <span class="amount">
          ${formatMoney(item.amount)}
        </span>
      </div>

      <div class="entry-row">
        <span>الفواتير</span>

        <span>
          ${formatMoney(totalInvoices)}
        </span>
      </div>

      <div class="entry-row">
        <span>المتبقي</span>

        <span class="remaining">
          ${formatMoney(remaining)}
        </span>
      </div>

      <div class="entry-row">
        <span>الحالة</span>

        <span class="${completed ? "status status-done" : "status status-open"}">
          ${completed ? "مصفاة" : "غير مصفاة"}
        </span>
      </div>

      ${
        custody
        ?
        `<div class="note">
          العهدة الأصلية: ${escapeHtml(custody.source)}
        </div>`
        :
        ""
      }

      <button
        class="primary small-btn"
        onclick="openPerson(${item.id})">

        🧾 فتح العهدة والفواتير

      </button>

      <button
        class="danger small-btn"
        onclick="deleteDistribution(${item.id})">

        🗑️ حذف عهدة الشخص

      </button>

    `;


    list.appendChild(div);

  });

}


/* ===================================
   فتح عهدة الشخص
=================================== */

function openPerson(id){

  currentDistributionId = id;

  currentPhoto = "";

  document.getElementById("homePage").style.display =
    "none";

  document.getElementById("personPage").style.display =
    "block";


  document.getElementById("invoiceAmount").value = "";

  document.getElementById("invoiceDescription").value = "";

  document.getElementById("invoiceNotes").value = "";

  document.getElementById("invoiceDate").value =
    new Date().toISOString().split("T")[0];

  document.getElementById("photoPreview").innerHTML =
    "";


  renderPersonPage();

}


/* ===================================
   عرض تفاصيل الشخص
=================================== */

function renderPersonPage(){

  const item =
    distributions.find(
      x => x.id === currentDistributionId
    );


  if(!item){

    goHome();

    return;
  }


  const totalInvoices =
    invoiceTotal(item.id);


  const remaining =
    personRemaining(item);


  const div =
    document.getElementById("personDetails");


  div.innerHTML = `

    <div class="card">

      <h2>
        👤 ${escapeHtml(item.person)}
      </h2>

      <div class="entry-row">
        <span>نوع العهدة</span>

        <span>
          ${escapeHtml(item.type)}
        </span>
      </div>

      <div class="entry-row">
        <span>المبلغ المسلم</span>

        <span class="amount">
          ${formatMoney(item.amount)}
        </span>
      </div>

      <div class="entry-row">
        <span>إجمالي الفواتير</span>

        <span>
          ${formatMoney(totalInvoices)}
        </span>
      </div>

      <div class="total-box">

        المبلغ المتبقي

        <strong>
          ${formatMoney(remaining)}
        </strong>

      </div>

      ${
        remaining === 0
        ?
        `
        <button
          class="primary"
          onclick="completeSettlement(${item.id})">

          ✅ تمت التصفية

        </button>
        `
        :
        `
        <button
          class="warning"
          onclick="settlementInfo(${item.id})">

          ⏳ العهدة غير مكتملة

        </button>
        `
      }

    </div>

  `;


  renderInvoices();

}


/* ===================================
   تصوير الفاتورة
=================================== */

function previewInvoicePhoto(event){

  const file =
    event.target.files[0];


  if(!file){

    currentPhoto = "";

    document.getElementById("photoPreview").innerHTML =
      "";

    return;
  }


  const reader =
    new FileReader();


  reader.onload = function(e){

    currentPhoto =
      e.target.result;


    document.getElementById("photoPreview").innerHTML = `

      <div class="invoice">

        <strong>معاينة الفاتورة</strong>

        <img
          src="${currentPhoto}"
          alt="صورة الفاتورة">

      </div>

    `;

  };


  reader.readAsDataURL(file);

}


/* ===================================
   إضافة فاتورة
=================================== */

function addInvoice(){

  if(!currentDistributionId){

    alert("لم يتم اختيار عهدة.");

    return;
  }


  const amount =
    Number(
      document.getElementById("invoiceAmount").value
    );


  const date =
    document.getElementById("invoiceDate").value;


  const description =
    document.getElementById("invoiceDescription")
      .value.trim();


  const notes =
    document.getElementById("invoiceNotes")
      .value.trim();


  const item =
    distributions.find(
      x => x.id === currentDistributionId
    );


  if(!item){

    alert("العهدة غير موجودة.");

    return;
  }


  if(!amount || amount <= 0){

    alert("اكتب مبلغ الفاتورة.");

    return;
  }


  if(!date){

    alert("اختر تاريخ الفاتورة.");

    return;
  }


  const currentTotal =
    invoiceTotal(item.id);


  const remaining =
    Number(item.amount) - currentTotal;


  if(amount > remaining){

    alert(
      "مبلغ الفاتورة أكبر من المتبقي في العهدة.\n\n" +

      "المتبقي: " +
      formatMoney(remaining)
    );

    return;
  }


  const invoice = {

    id: Date.now(),

    distributionId:
      currentDistributionId,

    amount: amount,

    date: date,

    description:
      description,

    notes:
      notes,

    photo:
      currentPhoto

  };


  invoices.unshift(invoice);

  saveData();


  document.getElementById("invoiceAmount").value = "";

  document.getElementById("invoiceDescription").value = "";

  document.getElementById("invoiceNotes").value = "";

  document.getElementById("photoPreview").innerHTML = "";

  document.getElementById("invoicePhoto").value = "";

  currentPhoto = "";


  renderPersonPage();

  renderPersons();

  updateStats();


  alert("تم حفظ الفاتورة بنجاح ✅");

}


/* ===================================
   عرض الفواتير
=================================== */

function renderInvoices(){

  const list =
    document.getElementById("invoiceList");

  list.innerHTML = "";


  const data =
    invoices.filter(
      x =>
        x.distributionId ===
        currentDistributionId
    );


  if(data.length === 0){

    list.innerHTML =
      '<div class="empty">لا توجد فواتير مسجلة لهذه العهدة.</div>';

    return;
  }


  data.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "invoice";


    div.innerHTML = `

      <div class="invoice-title">
        🧾 ${formatMoney(item.amount)}
      </div>

      <div class="entry-row">
        <span>التاريخ</span>

        <span>
          ${escapeHtml(item.date)}
        </span>
      </div>

      ${
        item.description
        ?
        `<div class="note">
          المصروف: ${escapeHtml(item.description)}
        </div>`
        :
        ""
      }

      ${
        item.notes
        ?
        `<div class="note">
          ملاحظات: ${escapeHtml(item.notes)}
        </div>`
        :
        ""
      }

      ${
        item.photo
        ?
        `<img
          src="${item.photo}"
          alt="صورة الفاتورة">
        `
        :
        `<div class="note">
          لا توجد صورة لهذه الفاتورة.
        </div>`
      }

      <button
        class="delete-btn small-btn"
        onclick="deleteInvoice(${item.id})">

        🗑️ حذف الفاتورة

      </button>

    `;


    list.appendChild(div);

  });

}


/* ===================================
   حذف فاتورة
=================================== */

function deleteInvoice(id){

  const invoice =
    invoices.find(x => x.id === id);


  if(!invoice) return;


  const ok =
    confirm(
      "هل تريد حذف هذه الفاتورة؟"
    );


  if(!ok) return;


  invoices =
    invoices.filter(
      x => x.id !== id
    );


  saveData();

  renderPersonPage();

  renderPersons();

  updateStats();

}


/* ===================================
   إتمام التصفية
=================================== */

function completeSettlement(id){

  const item =
    distributions.find(
      x => x.id === id
    );


  if(!item) return;


  const total =
    invoiceTotal(id);


  const remaining =
    Number(item.amount) - total;


  if(remaining !== 0){

    alert(
      "لا يمكن إتمام التصفية حتى يصبح المتبقي صفرًا.\n\n" +

      "المتبقي: " +
      formatMoney(remaining)
    );

    return;
  }


  const ok =
    confirm(
      "هل تريد اعتماد تصفية عهدة " +
      item.person +
      "؟"
    );


  if(!ok) return;


  item.status =
    "مصفاة";


  saveData();

  renderPersonPage();

  renderPersons();

  updateStats();


  alert(
    "تم اعتماد التصفية بنجاح ✅"
  );

}


/* ===================================
   معلومات التصفية
=================================== */

function settlementInfo(id){

  const item =
    distributions.find(
      x => x.id === id
    );


  if(!item) return;


  const total =
    invoiceTotal(id);


  const remaining =
    personRemaining(item);


  alert(
    "العهدة غير مكتملة\n\n" +

    "المبلغ المسلم: " +
    formatMoney(item.amount) +

    "\nإجمالي الفواتير: " +
    formatMoney(total) +

    "\nالمتبقي: " +
    formatMoney(remaining)
  );

}


/* ===================================
   العودة
=================================== */

function goHome(){

  currentDistributionId = null;

  document.getElementById("personPage").style.display =
    "none";

  document.getElementById("homePage").style.display =
    "block";

  render();

}


/* ===================================
   حذف العهدة الأصلية
=================================== */

function deleteCustody(id){

  const hasPeople =
    distributions.some(
      x => x.custodyId === id
    );


  if(hasPeople){

    alert(
      "لا يمكن حذف هذه العهدة لأنها مرتبطة بعهد أشخاص.\n" +
      "احذف العهد المرتبطة بها أولًا."
    );

    return;
  }


  const ok =
    confirm(
      "هل أنت متأكد من حذف هذه العهدة؟"
    );


  if(!ok) return;


  custodys =
    custodys.filter(
      x => x.id !== id
    );


  saveData();

  render();

}


/* ===================================
   حذف عهدة شخص
=================================== */

function deleteDistribution(id){

  const hasInvoices =
    invoices.some(
      x => x.distributionId === id
    );


  if(hasInvoices){

    alert(
      "لا يمكن حذف عهدة الشخص لأنها تحتوي على فواتير.\n" +
      "احذف الفواتير أولًا."
    );

    return;
  }


  const item =
    distributions.find(
      x => x.id === id
    );


  if(!item) return;


  const ok =
    confirm(
      "هل تريد حذف عهدة " +
      item.person +
      "؟"
    );


  if(!ok) return;


  distributions =
    distributions.filter(
      x => x.id !== id
    );


  saveData();

  render();

}


/* ===================================
   الإحصائيات
=================================== */

function updateStats(){

  let received = 0;

  let distributed = 0;

  let open = 0;


  custodys.forEach(item => {

    received +=
      Number(item.amount) || 0;

  });


  distributions.forEach(item => {

    distributed +=
      Number(item.amount) || 0;


    const remaining =
      personRemaining(item);


    if(remaining > 0){

      open++;

    }

  });


  const remaining =
    received - distributed;


  document.getElementById("totalReceived").textContent =
    formatMoney(received);


  document.getElementById("totalDistributed").textContent =
    formatMoney(distributed);


  document.getElementById("totalRemaining").textContent =
    formatMoney(remaining);


  document.getElementById("openCount").textContent =
    open;

}


/* ===================================
   تنسيق المبلغ
=================================== */

function formatMoney(number){

  return Number(number || 0)
    .toLocaleString("ar-YE") +
    " ريال";

}


/* ===================================
   حماية النص
=================================== */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* ===================================
   تشغيل
=================================== */

render();

</script>
